name: CI

on:
  push:
    branches: [master]
  pull_request:
    # "labeled": the API contract job reacts to the update-api-contract
    # and breaking-change labels.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (lint, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest patch of the current Go release. go.mod only sets the
          # minimum (1.26.0); building with an old patch would ship known,
          # since-fixed standard-library vulnerabilities.
          go-version: "1.27.x"
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...
      - run: go build ./...

      - name: Test (SQLite, race detector)
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  postgres:
    name: Go tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gohead
          POSTGRES_PASSWORD: gohead
          POSTGRES_DB: gohead
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gohead" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      GOHEAD_TEST_DATABASE_URL: postgres://gohead:gohead@localhost:5432/gohead?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest patch of the current Go release. go.mod only sets the
          # minimum (1.26.0); building with an old patch would ship known,
          # since-fixed standard-library vulnerabilities.
          go-version: "1.27.x"
          check-latest: true
      # Packages share one database, so run them one at a time.
      - run: scripts/go-test-annotate.sh -count=1 -p 1 ./pkg/... ./internal/...

  mysql:
    name: Go tests on MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: gohead
          MYSQL_DATABASE: gohead
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pgohead" --health-interval 5s
          --health-timeout 3s --health-retries 30
    env:
      GOHEAD_TEST_DATABASE_URL: mysql://root:gohead@tcp(127.0.0.1:3306)/gohead?charset=utf8mb4&parseTime=True&loc=UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      # Packages share one database, so run them one at a time.
      - run: scripts/go-test-annotate.sh -count=1 -p 1 ./pkg/... ./internal/...

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags: compare with the last release
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Generate the API snapshots
        run: UPDATE_API_CONTRACT=1 go test -count=1 -run TestAPIContract ./internal/openapi ./internal/graphql

      - name: Keep the generated snapshots
        uses: actions/upload-artifact@v7
        with:
          name: api-snapshots
          path: api/
          retention-days: 3

      - name: Snapshots match the code
        run: |
          if [ -n "$(git status --porcelain api/)" ]; then
            git diff --stat api/
            echo "::error title=API contract::The public API changed but api/ was not updated. Run 'make api-contract' and commit api/, or add the label update-api-contract to the PR."
            exit 1
          fi

      # The contract users rely on is the last release. A PR labelled
      # "breaking-change" acknowledges a deliberate break (next major).
      - name: No breaking change since the last release
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'breaking-change')
        shell: bash
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ] || ! git cat-file -e "$last:api/openapi.json" 2>/dev/null; then
            echo "No API snapshot in ${last:-any release} yet: nothing to compare."
            exit 0
          fi
          echo "Comparing with $last"
          git show "$last:api/openapi.json" > "$RUNNER_TEMP/openapi.json"
          git show "$last:api/graphql.json" > "$RUNNER_TEMP/graphql.json"
          go install github.com/oasdiff/oasdiff@v1.33.0
          "$(go env GOPATH)/bin/oasdiff" breaking "$RUNNER_TEMP/openapi.json" api/openapi.json --fail-on ERR --format githubactions
          npx --yes -p graphql@16.11.0 -p @graphql-inspector/cli@7.0.0 graphql-inspector diff "$RUNNER_TEMP/graphql.json" api/graphql.json

  # Label a PR "update-api-contract" to commit the snapshots generated above
  # to its branch. This job holds a write token, so it runs no repository
  # code: it only copies the artifact and pushes (PRs from this repository).
  # Commits pushed with the workflow token don't start CI: push again (or
  # close and reopen the PR) to check the result.
  api-contract-update:
    name: Commit API snapshots
    needs: api-contract
    if: >-
      always() && needs.api-contract.result != 'cancelled' &&
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'update-api-contract') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: api-snapshots
          path: api/
      - name: Commit and push
        run: |
          git add api/
          if git diff --cached --quiet; then echo "Snapshots already up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(api): update the API contract snapshots"
          git push

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest patch of the current Go release. go.mod only sets the
          # minimum (1.26.0); building with an old patch would ship known,
          # since-fixed standard-library vulnerabilities.
          go-version: "1.27.x"
          check-latest: true
      # The latest govulncheck may need a newer Go than the project; let the
      # go command fetch that toolchain just for the install. The scan itself
      # uses the project's Go version (go env GOVERSION).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
        env:
          GOTOOLCHAIN: auto
      - run: govulncheck ./...

  gui:
    name: Admin UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Admin UI smoke test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      E2E_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Start the API (SQLite, empty database)
        run: |
          go build -o gohead ./main
          ./gohead start > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8080/_health && exit 0; sleep 1; done
          cat api.log; exit 1
        env:
          GOHEAD_DATABASE_URL: sqlite://e2e.db
          GOHEAD_JWT_SECRET: e2e-only-secret-not-used-anywhere-else
          GOHEAD_REDIS_ADDRESS: localhost:6379
          GOHEAD_RATE_LIMIT_ENABLED: "false"
          GOHEAD_MEDIA_LOCAL_PATH: ./e2e-uploads
          GOHEAD_ADMIN_USERNAME: e2e-admin
          GOHEAD_ADMIN_EMAIL: e2e-admin@example.com
          GOHEAD_ADMIN_PASSWORD: e2e-password-123

      - name: Install
        working-directory: gui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke test
        working-directory: gui
        run: npx playwright test 2>&1 | tee ../e2e.log; exit "${PIPESTATUS[0]}"
        shell: bash

      # Job logs are not always at hand: surface the essentials on the PR.
      - name: Report failure details
        if: failure()
        run: |
          annotate() { [ -s "$2" ] && echo "::error title=$1::$(sed -e 's/%/%25/g' "$2" | awk 'BEGIN{ORS="%0A"} {print}')"; true; }
          grep -vE '^\s*$' e2e.log 2>/dev/null | grep -E -A25 'Error|✘|failed|Timeout' | head -120 > e2e.fail || true
          annotate "Playwright" e2e.fail
          grep -E '"level":"(error|fatal|warning)"' api.log 2>/dev/null | tail -40 > api.fail || true
          annotate "API log" api.fail

      - name: Keep the report and API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            gui/playwright-report
            gui/test-results
            api.log
          retention-days: 7

  standalone:
    name: Standalone (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          # Real ARM hardware, as on a Raspberry Pi with a 64-bit OS.
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Build (admin UI embedded, pure Go)
        run: make ui build
      - name: One process, no Redis
        run: scripts/smoke-standalone.sh dist/gohead | tee smoke.log
      - name: Report
        run: |
          size=$(du -h dist/gohead | cut -f1)
          mem=$(grep -o 'memory: .*' smoke.log)
          echo "**${{ matrix.arch }}**: binary $size, $mem" >> "$GITHUB_STEP_SUMMARY"

      # 32-bit Raspberry Pi OS: the armv7 binary migrates a SQLite database
      # under emulation.
      - name: armv7 binary
        if: matrix.arch == 'amd64'
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o gohead-armv7 ./main
          docker run --rm --platform linux/arm/v7 -v "$PWD:/w" -w /tmp \
            -e GOHEAD_DATABASE_URL=sqlite:///tmp/arm.db busybox:1.37 \
            sh -c '/w/gohead-armv7 version && /w/gohead-armv7 migrate && /w/gohead-armv7 migrate status'

  js:
    name: JavaScript client and starter
    runs-on: ubuntu-latest
    env:
      GOHEAD_URL: http://localhost:8080
      GOHEAD_USERNAME: admin
      GOHEAD_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Client (build, types, unit tests)
        run: |
          npm run build --workspace @gohead-cms/client
          npm rebuild @gohead-cms/client # link the gohead-client bin, built just now
          npm run typecheck --workspace @gohead-cms/client
          npm test --workspace @gohead-cms/client
          npm test --workspace @gohead-cms/create
      - name: Pack the packages
        run: |
          npm pack --workspace @gohead-cms/client --dry-run
          npm pack --workspace @gohead-cms/create --dry-run

      - name: Start GoHead (SQLite, empty database)
        run: |
          go build -o gohead ./main
          ./gohead start > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8080/_health && exit 0; sleep 1; done
          cat api.log; exit 1
        env:
          GOHEAD_DATABASE_URL: sqlite://js.db
          GOHEAD_JWT_SECRET: js-only-secret-not-used-anywhere-else
          GOHEAD_RATE_LIMIT_ENABLED: "false"
          GOHEAD_MEDIA_LOCAL_PATH: ./js-uploads
          GOHEAD_ADMIN_USERNAME: admin
          GOHEAD_ADMIN_EMAIL: admin@example.com
          GOHEAD_ADMIN_PASSWORD: ci-admin-password-123

      - name: Client against GoHead
        run: npm run test:integration --workspace @gohead-cms/client

      - name: Next.js starter (setup, types up to date, lint, build)
        working-directory: templates/nextjs-blog
        run: |
          npm run gohead:push
          npm run gohead:seed
          npm run gohead:types
          git diff --exit-code src/gohead.d.ts || { echo "::error::templates/nextjs-blog/src/gohead.d.ts is out of date: run npm run gohead:types"; exit 1; }
          npm run lint
          npm run typecheck
          npm run build

      - name: API log
        if: failure()
        run: tail -100 api.log

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Lint and validate every values set
        shell: bash
        run: |
          set -o pipefail
          for values in charts/gohead/ci/*-values.yaml; do
            echo "== $values"
            helm lint --strict charts/gohead -f "$values"
            # ServiceMonitor is a CRD: no schema in the default catalog.
            helm template ci charts/gohead -f "$values" \
              | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0
          done 2>&1 | tee -a helm.log

      - name: Missing database fails with a clear message
        shell: bash
        run: |
          if out=$(helm template ci charts/gohead 2>&1); then
            echo "::error::rendering without a database should fail"; exit 1
          fi
          echo "$out" >> helm.log
          grep -q "set database.url" <<<"$out"

      # Install the branch's images on a real cluster, then run `helm test`.
      - uses: helm/kind-action@v1.15.1
      - name: Build and load the images
        run: |
          docker build -t gohead:ci .
          docker build -t gohead-admin:ci gui
          kind load docker-image gohead:ci gohead-admin:ci --name chart-testing
      - name: Install on kind
        shell: bash
        run: |
          set -o pipefail
          kubectl create deployment postgres --image=postgres:17-alpine --port=5432
          kubectl set env deployment/postgres POSTGRES_USER=gohead POSTGRES_PASSWORD=gohead POSTGRES_DB=gohead
          kubectl expose deployment postgres --port=5432
          kubectl rollout status deployment/postgres --timeout=180s
          helm install gohead charts/gohead -f charts/gohead/ci/default-values.yaml \
            --set image.repository=gohead,image.tag=ci,image.pullPolicy=Never \
            --set admin.image.repository=gohead-admin,admin.image.tag=ci,admin.image.pullPolicy=Never \
            --wait --timeout 6m 2>&1 | tee -a helm.log
          helm test gohead --logs 2>&1 | tee -a helm.log
      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          {
            helm version; kubeconform -v
            kubectl get pods -o wide
            kubectl get events --sort-by=.lastTimestamp | tail -30
            for d in $(kubectl get deploy -o name); do echo "== $d"; kubectl logs "$d" --tail=15 --all-containers; done
          } >> helm.log 2>&1 || true
          { grep -vE '^\s*$' helm.log | grep -vE '^(Summary|==> Linting|1 chart|ci/|$)' | tail -150 > helm.fail; } || true
          split -l 50 helm.fail helm.chunk.
          for c in helm.chunk.*; do echo "::error title=helm::$(sed -e 's/%/%25/g' "$c" | awk 'BEGIN{ORS="%0A"} {print}')"; done

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict -f docs/mkdocs.yml
