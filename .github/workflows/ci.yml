name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (lint, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest patch of the current Go release. go.mod only sets the
          # minimum (1.26.0); building with an old patch would ship known,
          # since-fixed standard-library vulnerabilities.
          go-version: "1.27.x"
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...
      - run: go build ./...

      - name: Test (SQLite, race detector)
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  postgres:
    name: Go tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gohead
          POSTGRES_PASSWORD: gohead
          POSTGRES_DB: gohead
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gohead" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      GOHEAD_TEST_DATABASE_URL: postgres://gohead:gohead@localhost:5432/gohead?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest patch of the current Go release. go.mod only sets the
          # minimum (1.26.0); building with an old patch would ship known,
          # since-fixed standard-library vulnerabilities.
          go-version: "1.27.x"
          check-latest: true
      # Packages share one database, so run them one at a time.
      - run: scripts/go-test-annotate.sh -count=1 -p 1 ./pkg/... ./internal/...

  mysql:
    name: Go tests on MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: gohead
          MYSQL_DATABASE: gohead
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pgohead" --health-interval 5s
          --health-timeout 3s --health-retries 30
    env:
      GOHEAD_TEST_DATABASE_URL: mysql://root:gohead@tcp(127.0.0.1:3306)/gohead?charset=utf8mb4&parseTime=True&loc=UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      # Packages share one database, so run them one at a time.
      - run: scripts/go-test-annotate.sh -count=1 -p 1 ./pkg/... ./internal/...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest patch of the current Go release. go.mod only sets the
          # minimum (1.26.0); building with an old patch would ship known,
          # since-fixed standard-library vulnerabilities.
          go-version: "1.27.x"
          check-latest: true
      # The latest govulncheck may need a newer Go than the project; let the
      # go command fetch that toolchain just for the install. The scan itself
      # uses the project's Go version (go env GOVERSION).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
        env:
          GOTOOLCHAIN: auto
      - run: govulncheck ./...

  gui:
    name: Admin UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Admin UI smoke test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      E2E_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Start the API (SQLite, empty database)
        run: |
          go build -o gohead ./main
          ./gohead start > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8080/health && exit 0; sleep 1; done
          cat api.log; exit 1
        env:
          GOHEAD_DATABASE_URL: sqlite://e2e.db
          GOHEAD_JWT_SECRET: e2e-only-secret-not-used-anywhere-else
          GOHEAD_REDIS_ADDRESS: localhost:6379
          GOHEAD_RATE_LIMIT_ENABLED: "false"
          GOHEAD_MEDIA_LOCAL_PATH: ./e2e-uploads

      - name: Install
        working-directory: gui
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke test
        working-directory: gui
        run: npx playwright test

      - name: Keep the report and API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            gui/playwright-report
            gui/test-results
            api.log
          retention-days: 7

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict -f docs/mkdocs.yml
