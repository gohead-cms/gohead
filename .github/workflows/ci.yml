name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (lint, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.25 patch: go.mod says 1.25.0, which would pin a toolchain
          # with known (since fixed) standard-library vulnerabilities.
          go-version: "1.25.x"
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - run: go vet ./...
      - run: go build ./...

      - name: Test (SQLite, race detector)
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  postgres:
    name: Go tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gohead
          POSTGRES_PASSWORD: gohead
          POSTGRES_DB: gohead
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gohead" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      GOHEAD_TEST_DATABASE_URL: postgres://gohead:gohead@localhost:5432/gohead?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.25 patch: go.mod says 1.25.0, which would pin a toolchain
          # with known (since fixed) standard-library vulnerabilities.
          go-version: "1.25.x"
          check-latest: true
      # Packages share one database, so run them one at a time.
      - run: go test -count=1 -p 1 ./pkg/storage/... ./internal/api/... ./internal/graphql/...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.25 patch: go.mod says 1.25.0, which would pin a toolchain
          # with known (since fixed) standard-library vulnerabilities.
          go-version: "1.25.x"
          check-latest: true
      # The latest govulncheck may need a newer Go than the project; let the
      # go command fetch that toolchain just for the install. The scan itself
      # uses the project's Go version (go env GOVERSION).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
        env:
          GOTOOLCHAIN: auto
      - run: govulncheck ./...

  gui:
    name: Admin UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run build
      # The UI still has pre-existing lint findings; report them without
      # blocking until they are cleaned up.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict -f docs/mkdocs.yml
