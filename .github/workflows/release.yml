name: Release

# Pushing a tag vX.Y.Z publishes the GitHub release (binaries, checksums,
# SBOMs, changelog) with GoReleaser. Images for the same tag are built by
# images.yml.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # Latest patch of the current Go release. go.mod only sets the
          # minimum (1.26.0); building with an old patch would ship known,
          # since-fixed standard-library vulnerabilities.
          go-version: "1.27.x"
          check-latest: true

      - name: Install Syft (SBOMs)
        uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: enables the Homebrew formula (see .goreleaser.yaml).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz, dist/*.zip, dist/checksums.txt

  chart:
    name: Helm chart (OCI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      # The chart is versioned with GoHead: vX.Y.Z publishes chart X.Y.Z
      # deploying images X.Y.Z, at oci://ghcr.io/<owner>/charts/gohead.
      - name: Package and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/gohead --version "$version" --app-version "$version" --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/gohead-$version.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
