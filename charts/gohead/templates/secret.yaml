{{- if not .Values.existingSecret }}
{{- if not .Values.database.url }}
{{- fail "database: set database.url (PostgreSQL or MySQL) or existingSecret. GoHead's SQLite mode cannot be shared between the API and the workers." }}
{{- end }}
{{- $name := include "gohead.secretName" . }}
{{- $jwt := .Values.jwtSecret }}
{{- if not $jwt }}
{{- /* Keep the generated secret across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "GOHEAD_JWT_SECRET") }}
{{- $jwt = index $existing.data "GOHEAD_JWT_SECRET" | b64dec }}
{{- else }}
{{- $jwt = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gohead.labels" . | nindent 4 }}
type: Opaque
stringData:
  GOHEAD_DATABASE_URL: {{ .Values.database.url | quote }}
  GOHEAD_JWT_SECRET: {{ $jwt | quote }}
  {{- range $key, $value := .Values.extraSecretEnv }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
