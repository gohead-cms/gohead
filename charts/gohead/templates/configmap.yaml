apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gohead.fullname" . }}-config
  labels:
    {{- include "gohead.labels" . | nindent 4 }}
{{- /* Keys in .Values.config override the chart's own. */}}
{{- $config := dict "GOHEAD_SERVER_PORT" "8080" "GOHEAD_MEDIA_LOCAL_PATH" "/data/uploads" }}
{{- if (dig "initContainer" true (.Values.migrations | default dict)) }}
{{- $_ := set $config "GOHEAD_AUTO_MIGRATE" "false" }}
{{- end }}
{{- if not (hasKey .Values.config "GOHEAD_REDIS_ADDRESS") }}
{{- $_ := set $config "GOHEAD_REDIS_ADDRESS" (include "gohead.redisAddress" .) }}
{{- end }}
{{- $config = mergeOverwrite $config (deepCopy .Values.config) }}
data:
  {{- range $key := keys $config | sortAlpha }}
  {{ $key }}: {{ get $config $key | toString | quote }}
  {{- end }}
