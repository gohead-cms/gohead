apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gohead.fullname" . }}-config
  labels:
    {{- include "gohead.labels" . | nindent 4 }}
data:
  GOHEAD_SERVER_PORT: "8080"
  GOHEAD_REDIS_ADDRESS: {{ include "gohead.redisAddress" . | quote }}
  GOHEAD_MEDIA_LOCAL_PATH: /data/uploads
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
