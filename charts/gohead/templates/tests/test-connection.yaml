apiVersion: v1
kind: Pod
metadata:
  name: {{ include "gohead.fullname" . }}-test
  labels:
    {{- include "gohead.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: health
      image: docker.io/curlimages/curl:8.11.1
      args: ["-fsS", "--retry", "10", "--retry-connrefused", "--retry-delay", "3",
             "http://{{ include "gohead.fullname" . }}-api:{{ .Values.api.service.port }}/_health"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
