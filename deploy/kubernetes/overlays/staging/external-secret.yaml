# Pulls secrets from Azure Key Vault through External Secrets Operator.
# Adjust the store name and key names to your vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gohead-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: gohead-secrets
  data:
    - secretKey: GOHEAD_DATABASE_URL
      remoteRef: { key: gohead-staging-database-url }
    - secretKey: GOHEAD_JWT_SECRET
      remoteRef: { key: gohead-staging-jwt-secret }
    - secretKey: GOHEAD_REDIS_PASSWORD
      remoteRef: { key: gohead-staging-redis-password }
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: gohead-openai-api-key }
