# GoHead full stack: API, background workers, admin UI, PostgreSQL, Redis
# and MinIO (S3-compatible storage for uploads).
#
#   docker compose up -d            # pull published images
#   docker compose up -d --build    # build from this checkout
#
# API: http://localhost:8080   Admin UI: http://localhost:3000
# Uploaded files: http://localhost:9000/gohead/…  MinIO console: http://localhost:9001
# Set GOHEAD_JWT_SECRET (e.g. in a .env file) before exposing it anywhere.

x-gohead-env: &gohead-env
  GOHEAD_DATABASE_URL: postgres://gohead:gohead@postgres:5432/gohead?sslmode=disable
  GOHEAD_REDIS_ADDRESS: redis:6379
  GOHEAD_JWT_SECRET: ${GOHEAD_JWT_SECRET:-change-me-to-a-long-random-string-0123456789}
  # First administrator, created on an empty database when a username is
  # set (password: 12+ chars). See the README's quick start.
  GOHEAD_ADMIN_USERNAME: ${GOHEAD_ADMIN_USERNAME:-}
  GOHEAD_ADMIN_EMAIL: ${GOHEAD_ADMIN_EMAIL:-admin@example.com}
  GOHEAD_ADMIN_PASSWORD: ${GOHEAD_ADMIN_PASSWORD:-}
  GOHEAD_LOG_LEVEL: ${GOHEAD_LOG_LEVEL:-info}
  # Uploads go to the MinIO bucket below; files are served from its public URL.
  GOHEAD_MEDIA_DRIVER: s3
  GOHEAD_MEDIA_S3_ENDPOINT: http://minio:9000
  GOHEAD_MEDIA_S3_BUCKET: gohead
  GOHEAD_MEDIA_S3_REGION: us-east-1
  GOHEAD_MEDIA_S3_PATH_STYLE: "true"
  GOHEAD_MEDIA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-gohead}
  GOHEAD_MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gohead-minio-secret}
  GOHEAD_MEDIA_PUBLIC_URL: ${GOHEAD_PUBLIC_MEDIA_URL:-http://localhost:9000/gohead}
  # Needed by agents that use OpenAI (or set api_key per agent).
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

x-gohead: &gohead
  image: ghcr.io/gohead-cms/gohead:${GOHEAD_VERSION:-latest}
  build:
    context: .
  environment: *gohead-env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *gohead
    command: ["start", "--config", "/app/config.yaml"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

  worker:
    <<: *gohead
    command: ["worker", "--config", "/app/config.yaml"]

  dispatcher:
    <<: *gohead
    command: ["dispatcher", "--config", "/app/config.yaml"]

  # Run exactly one scheduler.
  scheduler:
    <<: *gohead
    command: ["scheduler", "--config", "/app/config.yaml"]

  admin:
    image: ghcr.io/gohead-cms/gohead-admin:${GOHEAD_VERSION:-latest}
    build:
      context: ./gui
    environment:
      GOHEAD_API_URL: ${GOHEAD_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:8080"
    restart: unless-stopped
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gohead
      POSTGRES_PASSWORD: gohead
      POSTGRES_DB: gohead
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gohead -d gohead"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gohead}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gohead-minio-secret}
    # Published on localhost only: the root credentials above are defaults.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Creates the bucket and lets anyone download a file whose URL they have
  # (like media URLs on a CDN), without listing the bucket. Runs once.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gohead}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gohead-minio-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/gohead &&
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::gohead/*"]}]}' > /tmp/policy.json &&
        mc anonymous set-json /tmp/policy.json local/gohead

volumes:
  postgres-data:
  redis-data:
  minio-data:
