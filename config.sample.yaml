# GoHead configuration.
#
# Every key can be overridden with an environment variable: prefix GOHEAD_,
# upper case, dots become underscores (redis.address -> GOHEAD_REDIS_ADDRESS).
# The file is optional; containers usually rely on environment variables only.

# debug | info | warn | error
log_level: info

# Gin mode: development | production | test
mode: production

# Port the API listens on.
server_port: "8080"

# sqlite://path/to/file.db
# postgres://user:pass@host:5432/db?sslmode=disable
# mysql://user:pass@tcp(host:3306)/db?charset=utf8mb4&parseTime=True&loc=UTC
database_url: sqlite://gohead.db

# Signs login tokens. Use a long random value (openssl rand -hex 32).
# If empty or left at the sample value, a random secret is generated at
# startup and tokens stop working after a restart.
jwt_secret: ""

# Export OpenTelemetry traces over OTLP/gRPC. The endpoint is read from the
# standard OTEL_EXPORTER_OTLP_ENDPOINT variable (default localhost:4317).
telemetry_enabled: false

# Background jobs (content events, agent runs, webhook deliveries).
#   redis:    in Redis (default of gohead start/worker/dispatcher/scheduler)
#   database: in GoHead's database, no Redis (default of gohead standalone)
queue:
  driver: ""             # empty: the command's default
  concurrency: 0         # jobs at once per process; 0: 4 standalone, 10 worker, 5 dispatcher
  poll_interval: 1s      # database driver: how often to look for other processes' jobs

# Redis backs the redis job queue, and lets API replicas share GraphQL schema
# changes and rate-limit counters. With the database queue it is used only
# when an address is set here or in GOHEAD_REDIS_ADDRESS.
redis:
  # address: localhost:6379   (default)
  password: ""
  db: 0

# Admin UI embedded in the binary, served at /.
ui:
  enabled: true

# Uploads (POST /api/media). Files go to a local directory by default, or to
# any S3-compatible bucket (AWS S3, MinIO, Cloudflare R2, Garage...).
media:
  enabled: true
  driver: local          # local | s3
  max_size_mb: 50
  allowed_types: []      # MIME patterns such as image/*; empty = built-in safe list
  public_url: ""         # base URL for file links (CDN, public bucket, https://cms.example.com/uploads)
  local:
    path: ./uploads
  s3:
    endpoint: ""         # e.g. https://s3.eu-west-1.amazonaws.com or http://minio:9000
    region: ""
    bucket: ""
    access_key: ""       # empty: AWS_* variables or the instance/pod role
    secret_key: ""
    path_style: false    # true for MinIO and most self-hosted stores
    prefix: ""
    presign_expiry: 1h   # lifetime of download URLs when public_url is empty

# Outbound webhooks (managed under /admin/webhooks).
webhooks:
  allow_private_networks: false  # true to call internal services (10.x, 192.168.x, localhost)
  timeout: 10s
  max_retries: 8

# OpenAPI document (/api/openapi.json) and Swagger UI (/api/docs).
openapi:
  enabled: true
  public: false   # true serves the document without a token

# First administrator, created at startup when the database has no users
# (or run `gohead admin create`). The password needs 12+ characters; prefer
# GOHEAD_ADMIN_PASSWORD over writing it here.
admin:
  username: ""
  email: ""
  password: ""

# Self-registration at POST /auth/register: disabled | open (viewer accounts).
auth:
  registration: disabled

# Apply database migrations when the API starts. Set to false when
# `gohead migrate` runs separately (the Helm chart does, in an init container).
auto_migrate: true

# Brute-force protection for /auth/login and /auth/register.
rate_limit:
  enabled: true
  auth_per_minute: 20  # requests per client IP
  login_failures: 5    # failed logins per username and IP before lockout (0 = off)
  login_window: 15m
  public_per_minute: 600  # anonymous /api requests per client IP (public access)

# IPs/CIDRs of the load balancer or ingress allowed to set X-Forwarded-For.
# Empty: the header is ignored and the connection's address is the client IP.
trusted_proxies: []

cors:
  allowed_origins: ["*"]
  allowed_methods: [GET, POST, PUT, DELETE, OPTIONS]
  allowed_headers: [Origin, Accept, Content-Type, Authorization, X-Requested-With]
  allow_credentials: true
  max_age: 86400

# Default LLM settings. Each agent can override provider, model, api_key and
# base_url in its own llm_config.
llm:
  provider: openai        # openai | anthropic | ollama
  model: gpt-4o
  api_key: ""             # falls back to OPENAI_API_KEY / ANTHROPIC_API_KEY
  base_url: ""            # optional: Azure/OpenAI-compatible endpoint, Ollama URL
  # Prices of the default model in USD per million tokens, used to show run
  # costs and enforce max_cost_per_day. 0 = cost not tracked.
  input_cost_per_million: 0
  output_cost_per_million: 0

# Agent run history.
agents:
  runs_kept: 200          # newest runs kept per agent (older ones are pruned)
